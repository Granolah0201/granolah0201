name: Deploy Reelwild to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'animal-reel/app/**'
      - '.github/workflows/deploy-animal-reel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: animal-reel/app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: animal-reel/app/package-lock.json

      - run: npm ci

      - run: npm run build
        env:
          # Pages serves the site from /<repo>/, and a relative base keeps the
          # same build working on Cloudflare Pages at the domain root.
          VITE_BASE: ./

      - uses: actions/upload-pages-artifact@v3
        with:
          path: animal-reel/app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
