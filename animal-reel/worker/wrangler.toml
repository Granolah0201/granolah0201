name = "animal-reel-worker"
main = "src/index.ts"
compatibility_date = "2024-12-05"

# Free-tier Worker. Secrets are set with `wrangler secret put <NAME>` and are
# never exposed to the front end.
#
#   wrangler secret put GEMINI_API_KEY
#   wrangler secret put PEXELS_API_KEY
#   wrangler secret put PIXABAY_API_KEY
#   wrangler secret put APP_TOKEN        # shared secret the PWA sends
#
[vars]
GEMINI_FLASH_MODEL = "gemini-2.5-flash"
GEMINI_FLASH_LITE_MODEL = "gemini-2.5-flash-lite"
# Comma-separated origins allowed to call this Worker. "*" allows any.
ALLOWED_ORIGINS = "*"
